[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tablewarden"
version = "0.1.0"
description = "Data-quality checks for Postgres, SQLite and CSV, declared in TOML, run as a CI gate."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Sri Hari Manikandan" }]
keywords = ["data-quality", "postgres", "sqlite", "csv", "ci", "testing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["psycopg[binary]>=3.2", "pytest>=8.3", "mypy>=1.13", "ruff>=0.8"]

[project.scripts]
tablewarden = "tablewarden.cli:main"

[project.urls]
Repository = "https://github.com/sriharifortitude/tablewarden"

[tool.hatch.build.targets.wheel]
packages = ["src/tablewarden"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "S", "PL", "N", "C4", "T20"]
ignore = ["PLR2004", "S101", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ANN", "PLR", "T20"]
"src/tablewarden/cli.py" = ["T20"]
# SQL is assembled from identifiers the config layer restricted to [A-Za-z0-9_]
# and double-quoted; every value is a bound parameter. S608 cannot see that.
"src/tablewarden/checks.py" = ["S608"]
"src/tablewarden/sources.py" = ["S608"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: needs DATABASE_URL pointing at a scratch Postgres"]
