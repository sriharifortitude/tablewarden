name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Ruff, mypy, pytest (SQLite, CSV, Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tw
          POSTGRES_PASSWORD: tw
          POSTGRES_DB: tw
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tw -d tw"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TABLEWARDEN_TEST_DSN: postgresql://tw:tw@127.0.0.1:5432/tw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - run: pytest -q
      - name: Build the wheel and run the CLI from it
        run: |
          pip install build && python -m build --wheel
          pip install --force-reinstall dist/*.whl
          tablewarden run examples/shop.toml --format junit --output report.xml || test $? -eq 1
          test -s report.xml
